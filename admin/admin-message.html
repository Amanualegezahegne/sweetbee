<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SweetBee Admin — Messages</title>
    <link rel="stylesheet" href="admin-full.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
<div class="dash-layout">

    <aside class="dash-sidebar" id="sidebar">
        <div class="sidebar-logo">
            <img src="images/logo.png" alt="SweetBee" />
            <span>SweetBee</span>
        </div>
        <nav class="sidebar-nav">
            <a href="admin home.html"><i class="fas fa-home"></i> Dashboard</a>
            <a href="admin-message.html" class="active"><i class="fas fa-envelope"></i> Messages</a>
            <a href="manage-product.html"><i class="fas fa-box"></i> Products</a>
            <div class="nav-divider"></div>
            <a href="edit-profile.html"><i class="fas fa-user-cog"></i> Edit Profile</a>
            <div class="nav-divider"></div>
            <a href="admin.html" class="sidebar-logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </nav>
    </aside>
    <div class="sidebar-overlay" id="overlay" onclick="closeSidebar()"></div>

    <div class="dash-main">
        <header class="dash-topbar">
            <div style="display:flex;align-items:center;gap:12px;">
                <button class="mobile-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                <span class="dash-topbar-title">Customer Messages</span>
            </div>
        </header>

        <main class="dash-content">
            <div class="section-header">
                <h2><i class="fas fa-inbox" style="color:var(--brand);margin-right:8px;"></i>All Messages</h2>
                <span id="msgCount" style="font-size:0.85rem;color:var(--text-muted);"></span>
            </div>

            <div class="messages-table-wrap">
                <table class="messages-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Message</th>
                            <th>Date</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="messageTableBody">
                        <tr>
                            <td colspan="6">
                                <div class="empty-state">
                                    <i class="fas fa-inbox"></i>
                                    <p>Loading messages…</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>

        <footer class="dash-footer">© 2025 SweetBee Honey — Admin Panel</footer>
    </div>
</div>

<div id="admin-toast-container"></div>

<script src="admin-dashboard.js"></script>
<script>
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('overlay').classList.toggle('show');
    }
    function closeSidebar() {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('overlay').classList.remove('show');
    }
</script>
</body>
</html>
