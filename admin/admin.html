<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login</title>
    <link rel="stylesheet" href="admin-full.css" />
</head>

<body class="login-body">
    <div class="login-wrapper">

        <!-- 🔶 Header with Logo -->
        <div class="header-container">
            <div class="logo-title">
                <img src="images/logo.png" alt="Sweet Bee Honey Logo" class="logo" />
                <h1>SweetBee Honey</h1>
            </div>
        </div>

        <h2 class="page-title">🔐 Admin Login</h2>

        <form id="loginForm" class="admin-login-form">
            <input type="text" id="username" placeholder="Username" required />
            <input type="password" id="password" placeholder="Password" required />
            <button type="submit" class="login-btn">Login</button>
        </form>

        <!-- Forgot Password Link -->
        <p class="forgot-password">
            <a href="reset-request.html">Forgot Password?</a>
        </p>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const form = document.getElementById("loginForm");

            form.addEventListener("submit", async (e) => {
                e.preventDefault();

                const username = document.getElementById("username").value.trim();
                const password = document.getElementById("password").value.trim();

                try {
                    const res = await fetch("http://localhost:3001/admin/login", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ username, password }),
                    });

                    const data = await res.json();

                    if (data.success) {
                        alert("✅ Login successful!");
                        window.location.href = "admin home.html";
                    } else {
                        alert("❌ Invalid credentials. Try again.");
                    }
                } catch (err) {
                    console.error("Error during login:", err);
                    alert("⚠️ Could not connect to server.");
                }
            });
        });
    </script>
</body>

</html>
