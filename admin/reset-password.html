<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset Password</title>
    <link rel="stylesheet" href="admin-full.css" />
    <style>
        /* Page-specific overrides */
        .reset-container {
            max-width: 400px;
            margin: 60px auto;
            background: #fff8dc;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .reset-container h2 {
            text-align: center;
            color: #d49600;
            margin-bottom: 20px;
        }

        .reset-container input {
            padding: 12px;
            border: 1px solid #d49600;
            border-radius: 8px;
            font-size: 1rem;
            width: 100%;
            margin-bottom: 15px;
        }

        .reset-container button {
            background-color: #28a745;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
            width: 100%;
        }

        .reset-container button:hover {
            background-color: #218838;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        #message.error {
            color: red;
        }

        #message.success {
            color: green;
        }
    </style>
</head>

<body>
    <div class="reset-container">
        <h2>🔑 Reset Your Password</h2>
        <form id="resetForm">
            <input type="password" id="newPassword" placeholder="Enter new password" required minlength="6" />
            <input type="password" id="confirmPassword" placeholder="Confirm new password" required minlength="6" />
            <button type="submit">Reset Password</button>
        </form>
        <p id="message"></p>
    </div>

    <!-- External JS -->
    <script src="admin-dashboard.js"></script>
</body>

</html>
