<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SweetBee Admin — Reset Password</title>
    <link rel="stylesheet" href="admin-full.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="auth-body">
    <div class="auth-card">
        <div class="auth-logo">
            <img src="images/logo.png" alt="SweetBee Logo" />
            <span>SweetBee Admin</span>
        </div>
        <h2 class="auth-heading">Set New Password</h2>
        <p class="auth-sub">Choose a strong password for your admin account</p>

        <div class="auth-error" id="resetError"></div>
        <div id="resetSuccess" style="display:none;background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);color:#4ade80;border-radius:8px;padding:10px 14px;font-size:0.875rem;text-align:center;margin-bottom:16px;"></div>

        <form id="resetForm" class="auth-form">
            <div class="auth-field">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" placeholder="Min. 6 characters" required minlength="6" />
            </div>
            <div class="auth-field">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Repeat new password" required minlength="6" />
            </div>
            <button type="submit" class="auth-btn" id="resetBtn">
                <i class="fas fa-lock"></i> Reset Password
            </button>
        </form>

        <div id="message"></div>

        <div class="auth-link">
            <a href="admin.html"><i class="fas fa-arrow-left"></i> Back to Login</a>
        </div>
    </div>
    <script src="admin-dashboard.js"></script>
</body>
</html>
